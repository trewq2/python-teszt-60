/* For true unicode PDF via browser print (print view is deliberately without the answer key). */
@media print{
  @page{size:A4 portrait;margin:15mm}
  html,body{background:white!important;color:#111!important;margin:0!important;padding:0!important}
  body>*:not(#print-sheet){display:none!important}
  #print-sheet{display:block!important;position:static!important;background:white!important;color:#172334!important;font-family:Arial,sans-serif!important;font-size:12px!important;padding:0!important;line-height:1.5!important}
  #print-sheet .pr-head{border-bottom:4px solid #0a7085;padding:0 0 13px;margin-bottom:24px}
  #print-sheet h1{font-size:27px;color:#102b48;margin:4px 0}
  #print-sheet h2{font-size:17px;margin:20px 0 10px;color:#123851}
  #print-sheet .pr-meta{font-size:11px;color:#617186}
  #print-sheet .pr-score{font-size:45px;font-weight:800;color:#08768b;line-height:1;margin:16px 0 5px}
  #print-sheet .pr-score small{font-size:16px;color:#34546a}
  #print-sheet table{width:100%;border-collapse:collapse;margin:12px 0}
  #print-sheet td,#print-sheet th{border-bottom:1px solid #cad6dc;padding:8px 7px;text-align:left}
  #print-sheet th{background:#eaf5f7}
  #print-sheet .pr-foot{border-top:1px solid #cad6dc;margin-top:25px;padding-top:10px;color:#596a7a;font-size:10px}
}

.review-toolbar strong{display:block;font-size:16px;color:#d9e9f7}
.review-toolbar p{font-size:12px;color:var(--muted);margin:4px 0 0}
.review-toolbar .btn{min-height:39px;padding:9px 13px;font-size:12px;white-space:nowrap}
.review-status{font-weight:800;font-size:11px;display:inline-block;margin-left:8px}
.review-status.correct{color:#a2e7bb}.review-status.wrong-answer{color:#ffaaa5}.review-status.unanswered{color:#ffd38b}
.review-events{border:1px solid #34516c;border-radius:14px;padding:16px;background:#0d1b2f;font-size:13px;color:#c7d9e8}
.review-events p{margin:0 0 10px}.review-events p:last-child{margin-bottom:0}
@media(max-width:640px){.review-toolbar{flex-direction:column}.review-toolbar .btn{width:100%}}

body{font-size:16px}
.topic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.python-code{margin:18px 0 24px;padding:20px;border:1px solid #365477;border-radius:13px;background:#081323;color:#e4f5fd;overflow-x:auto;text-align:left;font:15px/1.65 Consolas,'Courier New',monospace;white-space:pre;tab-size:4}
.python-code code{font:inherit;white-space:inherit}
.wrong .python-code{font-size:13px;margin:12px 0}
.explanation{border-top:1px solid var(--line);padding-top:10px!important;margin-top:12px!important;color:#d0dfef!important}
.grade-box{border:1px solid #466877;border-radius:14px;padding:15px 20px;background:#163039;margin:20px 0;font-size:18px;color:#c7f1df}
.grade-box strong{font-size:25px}.grade-table{width:100%;border-collapse:collapse;margin:14px 0}.grade-table th,.grade-table td{padding:10px 15px;border-bottom:1px solid var(--line);text-align:left}.grade-table th{color:var(--cyan)}
.score-ring-inner strong{font-size:30px}.option span:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
.connection-tools{margin-top:25px}.topic-grid .topic{min-width:0}.question-card h1{font-size:26px}.wrong h3{white-space:pre-wrap}
@media(max-width:800px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.topic-grid{grid-template-columns:1fr}.python-code{font-size:13px;padding:12px}.grade-table td,.grade-table th{padding:8px}.score-ring-inner strong{font-size:25px}}
@media print{#print-sheet .pr-grade{font-size:20px;font-weight:bold;margin:15px 0}#print-sheet .python-code{color:#111;background:#fff;border-color:#ccc;white-space:pre-wrap}#print-sheet .answer-report{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

<script>window.PYTHON_EXAM={"title":"Python tudáspróba","examId":"PYTHON-ALAPOK-60","version":1,"durationMinutes":60,"reviewMinutes":5,"allowedDepartures":2,"maxPoints":60,"sections":[{"id":1,"title":"Adatbevitel, típusok és kiírás","questions":[{"id":"py60-01","section":1,"originalNumber":1,"text":"Milyen típusú az adat az alábbi bekérés után, ha a felhasználó 12-t ír be?","code":"adat = input(\"Adj meg egy számot: \")","points":1,"options":[{"id":"o0","text":"int"},{"id":"o1","text":"float"},{"id":"o2","text":"str"},{"id":"o3","text":"bool"}],"correctOptionId":"o2","explanation":"Az input() mindig szöveget ad vissza. Számolás előtt int() vagy float() segítségével kell átalakítani."},{"id":"py60-02","section":1,"originalNumber":2,"text":"Mit ír ki a program?","code":"adat = \"12\"\nszam = int(adat)\nprint(szam + 2)","points":1,"options":[{"id":"o0","text":"122"},{"id":"o1","text":"14"},{"id":"o2","text":"12"},{"id":"o3","text":"Hibaüzenetet ad."}],"correctOptionId":"o1","explanation":"Az int() a szöveges 12-ből egész számot készít, ezért a + összeadást végez."},{"id":"py60-03","section":1,"originalNumber":3,"text":"Melyik kifejezés alakítja a szöveget 3.5 értékű valós számmá?","code":"adat = \"3,5\"","points":1,"options":[{"id":"o0","text":"int(adat)"},{"id":"o1","text":"float(adat)"},{"id":"o2","text":"str(adat)"},{"id":"o3","text":"float(adat.replace(\",\", \".\"))"}],"correctOptionId":"o3","explanation":"A float() tizedespontot vár. A replace() előbb kicseréli a vesszőt pontra."},{"id":"py60-04","section":1,"originalNumber":4,"text":"Mit ír ki a program?","code":"print(\"3.5\".isdigit())","points":1,"options":[{"id":"o0","text":"False"},{"id":"o1","text":"True"},{"id":"o2","text":"3.5"},{"id":"o3","text":"ValueError"}],"correctOptionId":"o0","explanation":"Az isdigit() nem általános számellenőrzés: a tizedespont nem számjegy, ezért az eredmény False."},{"id":"py60-05","section":1,"originalNumber":5,"text":"Melyik kivételt kell elkapni, ha a float() a felhasználó által beírt „alma” szöveget próbálja számmá alakítani?","code":"","points":1,"options":[{"id":"o0","text":"FileNotFoundError"},{"id":"o1","text":"ValueError"},{"id":"o2","text":"IndexError"},{"id":"o3","text":"ZeroDivisionError"}],"correctOptionId":"o1","explanation":"A szöveg nem alakítható valós számmá. Ezt az átalakítás ValueError kivétellel jelzi."},{"id":"py60-06","section":1,"originalNumber":6,"text":"Mi a kiírt eredmény?","code":"ertek = 12.36\nprint(f\"{ertek:.1f}\")","points":1,"options":[{"id":"o0","text":"12.36"},{"id":"o1","text":"12.3"},{"id":"o2","text":"12.4"},{"id":"o3","text":"12.400"}],"correctOptionId":"o2","explanation":"A :.1f egy tizedesjegyet jelenít meg, kerekítéssel. A 12.36 így 12.4 lesz."},{"id":"py60-07","section":1,"originalNumber":7,"text":"Mi a kiírt eredmény?","code":"ertek = 2.5\nprint(f\"{ertek:.3f}\")","points":1,"options":[{"id":"o0","text":"2.500"},{"id":"o1","text":"2.5"},{"id":"o2","text":"2.000"},{"id":"o3","text":"3"}],"correctOptionId":"o0","explanation":"A :.3f pontosan három tizedesjegyet ír ki, szükség esetén nullákkal kiegészítve."},{"id":"py60-08","section":1,"originalNumber":8,"text":"Mit ír ki a program?","code":"adat = \"4\"\nprint(adat * 3)","points":1,"options":[{"id":"o0","text":"12"},{"id":"o1","text":"4 4 4"},{"id":"o2","text":"Hibaüzenetet ad."},{"id":"o3","text":"444"}],"correctOptionId":"o3","explanation":"Szöveg és egész szám szorzása szövegismétlést jelent. A „4” háromszor kerül egymás mellé."},{"id":"py60-09","section":1,"originalNumber":9,"text":"Pontosan milyen szöveg jelenik meg? A program nem ír utána sortörést.","code":"print(\"Kékes\", 1014, sep=\"|\", end=\"!\")","points":1,"options":[{"id":"o0","text":"Kékes 1014!"},{"id":"o1","text":"Kékes|1014!"},{"id":"o2","text":"Kékes;1014!"},{"id":"o3","text":"Kékes|1014"}],"correctOptionId":"o1","explanation":"A sep a kiírt értékek közé, az end az egész kiírás végére kerül."},{"id":"py60-10","section":1,"originalNumber":10,"text":"A szokásos Thonny-beállításokkal melyik billentyű indítja el a szerkesztőben megnyitott Python-programot?","code":"","points":1,"options":[{"id":"o0","text":"F1"},{"id":"o1","text":"F2"},{"id":"o2","text":"F5"},{"id":"o3","text":"F12"}],"correctOptionId":"o2","explanation":"Az F5 a megnyitott program futtatását indítja. A bekért adatot a Shell mezőben kell megadni."}]},{"id":2,"title":"Műveletek és feltételek","questions":[{"id":"py60-11","section":2,"originalNumber":11,"text":"Mennyi az autó üzemanyagköltsége a program szerint? A 6.0 liter/100 km fogyasztást, a 640 pedig Ft/liter árat jelent.","code":"tav = 200\nfogyasztas = 6.0\nliterar = 640\nkoltseg = tav / 100 * fogyasztas * literar\nprint(koltseg)","points":1,"options":[{"id":"o0","text":"7680.0 Ft"},{"id":"o1","text":"1280.0 Ft"},{"id":"o2","text":"3840.0 Ft"},{"id":"o3","text":"76800.0 Ft"}],"correctOptionId":"o0","explanation":"200 km-en 200 / 100 × 6 = 12 liter fogy. A költség 12 × 640 = 7680 Ft."},{"id":"py60-12","section":2,"originalNumber":12,"text":"Az átváltási szabály: 1 mérföld = 1.609344 kilométer. Melyik képlet váltja át a km változóban tárolt kilométert mérföldre?","code":"","points":1,"options":[{"id":"o0","text":"km * 1.609344"},{"id":"o1","text":"km + 1.609344"},{"id":"o2","text":"1.609344 / km"},{"id":"o3","text":"km / 1.609344"}],"correctOptionId":"o3","explanation":"Kilométerről mérföldre az egy mérföldhöz tartozó kilométerértékkel osztunk."},{"id":"py60-13","section":2,"originalNumber":13,"text":"A Fahrenheit-érték képlete: C × 9 / 5 + 32. Mit ír ki a program?","code":"celsius = 20\nprint(celsius * 9 / 5 + 32)","points":1,"options":[{"id":"o0","text":"68.0"},{"id":"o1","text":"52.0"},{"id":"o2","text":"36.0"},{"id":"o3","text":"20.0"}],"correctOptionId":"o0","explanation":"20 × 9 / 5 + 32 = 68. A / művelet miatt az eredmény float."},{"id":"py60-14","section":2,"originalNumber":14,"text":"Az átváltási szabály: 1 inch = 25.4 mm. Hány inch 50.8 mm?","code":"","points":1,"options":[{"id":"o0","text":"0.5"},{"id":"o1","text":"25.4"},{"id":"o2","text":"2.0"},{"id":"o3","text":"1290.32"}],"correctOptionId":"o2","explanation":"Az inchérték a milliméterérték osztva 25.4-del: 50.8 / 25.4 = 2.0."},{"id":"py60-15","section":2,"originalNumber":15,"text":"Mit ír ki a program?","code":"print(17 // 5, 17 % 5)","points":1,"options":[{"id":"o0","text":"3.4 2"},{"id":"o1","text":"3 2"},{"id":"o2","text":"2 3"},{"id":"o3","text":"3 3"}],"correctOptionId":"o1","explanation":"A // egész hányadost, a % maradékot számít. 17 = 3 × 5 + 2."},{"id":"py60-16","section":2,"originalNumber":16,"text":"Melyik feltétel fogadja el a 3.5 és 19.7 közötti számokat, mindkét határértéket beleértve?","code":"","points":1,"options":[{"id":"o0","text":"szam > 3.5 and szam \u003c 19.7"},{"id":"o1","text":"szam >= 3.5 or szam \u003c= 19.7"},{"id":"o2","text":"szam \u003c 3.5 and szam > 19.7"},{"id":"o3","text":"3.5 \u003c= szam \u003c= 19.7"}],"correctOptionId":"o3","explanation":"A láncolt összehasonlítás mindkét határt egyszerre ellenőrzi. A \u003c= miatt a határértékek is jók."},{"id":"py60-17","section":2,"originalNumber":17,"text":"Melyik feltétel igaz a kedvezményes korosztályra, ha a 18 év alattiak és a legalább 65 évesek kapnak kedvezményt?","code":"","points":1,"options":[{"id":"o0","text":"eletkor \u003c 18 and eletkor >= 65"},{"id":"o1","text":"eletkor \u003c= 18 or eletkor > 65"},{"id":"o2","text":"eletkor \u003c 18 or eletkor >= 65"},{"id":"o3","text":"18 \u003c= eletkor \u003c 65"}],"correctOptionId":"o2","explanation":"Elég a két feltétel egyikét teljesíteni, ezért or kell. A 18 éves már nem gyermek, a 65 éves már kedvezményes."},{"id":"py60-18","section":2,"originalNumber":18,"text":"Mit ír ki az if–elif–else szerkezet?","code":"eletkor = 17\nif eletkor \u003c= 5:\n    print(\"Ingyenes\")\nelif eletkor \u003c 18:\n    print(\"Kedvezményes\")\nelse:\n    print(\"Teljes árú\")","points":1,"options":[{"id":"o0","text":"Kedvezményes"},{"id":"o1","text":"Ingyenes"},{"id":"o2","text":"Teljes árú"},{"id":"o3","text":"Semmit"}],"correctOptionId":"o0","explanation":"Az első feltétel hamis, a második igaz. Az elif ág fut le; az else már nem."},{"id":"py60-19","section":2,"originalNumber":19,"text":"Mit ír ki a program?","code":"szam = 6\nprint(not (szam % 2 == 0))","points":1,"options":[{"id":"o0","text":"True"},{"id":"o1","text":"False"},{"id":"o2","text":"6"},{"id":"o3","text":"Hibaüzenetet ad."}],"correctOptionId":"o1","explanation":"A 6 páros, ezért a zárójelben True keletkezik. A not ezt False-ra fordítja."},{"id":"py60-20","section":2,"originalNumber":20,"text":"Melyik állítás helyes a Python = és == jeléről?","code":"","points":1,"options":[{"id":"o0","text":"Mindkettő értékadást végez."},{"id":"o1","text":"Mindkettő összehasonlít."},{"id":"o2","text":"A = összehasonlít, a == értéket ad."},{"id":"o3","text":"A = értéket ad, a == egyenlőséget vizsgál."}],"correctOptionId":"o3","explanation":"Például x = 5 eltárolja az 5-öt; x == 5 logikai eredményt ad az egyenlőségről."}]},{"id":3,"title":"Ciklusok és véletlen számok","questions":[{"id":"py60-21","section":3,"originalNumber":21,"text":"Hányszor fut le a ciklus törzse?","code":"for kor in range(1, 6):\n    print(kor)","points":1,"options":[{"id":"o0","text":"4-szer"},{"id":"o1","text":"6-szor"},{"id":"o2","text":"5-ször"},{"id":"o3","text":"Egyszer sem"}],"correctOptionId":"o2","explanation":"A range(1, 6) az 1, 2, 3, 4, 5 értékeket adja. A felső határ kimarad."},{"id":"py60-22","section":3,"originalNumber":22,"text":"Mit ír ki a program?","code":"osszeg = 0\nfor szam in range(1, 5):\n    osszeg += szam\nprint(osszeg)","points":1,"options":[{"id":"o0","text":"10"},{"id":"o1","text":"6"},{"id":"o2","text":"15"},{"id":"o3","text":"4"}],"correctOptionId":"o0","explanation":"Az összegbe 1 + 2 + 3 + 4 kerül, így a végén 10 lesz."},{"id":"py60-23","section":3,"originalNumber":23,"text":"Melyik számsor kerül a képernyőre?","code":"for szam in range(2, 9, 2):\n    print(szam, end=\" \")","points":1,"options":[{"id":"o0","text":"2 3 4 5 6 7 8"},{"id":"o1","text":"2 4 6 8"},{"id":"o2","text":"2 4 6"},{"id":"o3","text":"4 6 8"}],"correctOptionId":"o1","explanation":"2-ről indulunk, kettesével lépünk, és a 9 már nem kerül bele."},{"id":"py60-24","section":3,"originalNumber":24,"text":"Mi lesz a program kimenete?","code":"i = 0\nwhile i \u003c 3:\n    print(i, end=\" \")\n    i += 1","points":1,"options":[{"id":"o0","text":"1 2 3"},{"id":"o1","text":"0 1 2 3"},{"id":"o2","text":"3 2 1"},{"id":"o3","text":"0 1 2"}],"correctOptionId":"o3","explanation":"A kiírás a növelés előtt történik. A 3 \u003c 3 már hamis, ezért a 3-at nem írjuk ki."},{"id":"py60-25","section":3,"originalNumber":25,"text":"Mit kell az üres sor helyére írni, hogy a ciklus kiírja az 1, 2, 3 számot, majd véget érjen?","code":"i = 1\nwhile i \u003c= 3:\n    print(i)\n    # IDE KERÜL A HIÁNYZÓ SOR","points":1,"options":[{"id":"o0","text":"i += 1"},{"id":"o1","text":"i -= 1"},{"id":"o2","text":"i = 1"},{"id":"o3","text":"i == 3"}],"correctOptionId":"o0","explanation":"Növelni kell az i értékét. Ha nem változik, az i \u003c= 3 feltétel végig igaz marad."},{"id":"py60-26","section":3,"originalNumber":26,"text":"Mit tesz a break egy ciklusban?","code":"","points":1,"options":[{"id":"o0","text":"Újrakezdi a teljes programot."},{"id":"o1","text":"Csak a következő sort hagyja ki."},{"id":"o2","text":"Kilép a legbelső, őt tartalmazó ciklusból."},{"id":"o3","text":"Minden változót töröl."}],"correctOptionId":"o2","explanation":"A break megszakítja az aktuális ciklust. A program a ciklus utáni utasítással folytatódik."},{"id":"py60-27","section":3,"originalNumber":27,"text":"Mi lesz a kimenet?","code":"for szam in range(1, 5):\n    if szam % 2 == 0:\n        continue\n    print(szam, end=\" \")","points":1,"options":[{"id":"o0","text":"1 2 3 4"},{"id":"o1","text":"1 3"},{"id":"o2","text":"2 4"},{"id":"o3","text":"1 3 5"}],"correctOptionId":"o1","explanation":"A páros számoknál a continue átugorja a ciklustörzs maradékát, ezért csak az 1 é     else if (pendingWarning) setTimeout(showPendingWarning,150);
  });
  window.addEventListener('blur', () => guard('A böngésző elvesztette a fókuszt'));
  window.addEventListener('focus', () => {if (pendingWarning) setTimeout(showPendingWarning,140);});
  document.addEventListener('fullscreenchange', () => {
    if (state?.stage==='exam' && !document.fullscreenElement && Date.now()>guardGraceUntil) guard('Kilépés teljes képernyőből');
  });
  window.addEventListener('pagehide', () => guard('Az oldal elhagyása vagy újratöltése'));
  window.addEventListener('beforeunload', e => {
    if (state?.stage==='exam') {e.preventDefault();e.returnValue='';}
  });
  window.addEventListener('popstate', () => {
    if (state?.stage==='exam') {
      guard('Böngésző visszalépés');
      history.pushState({pythonExam:true},'',location.pathname+location.search+location.hash);
    }
  });
  document.addEventListener('contextmenu',e=>{if(state?.stage==='exam') e.preventDefault();});
  document.addEventListener('copy',e=>{if(state?.stage==='exam') e.preventDefault();});
  document.addEventListener('keydown',e=>{
    if (state?.stage!=='exam') return;
    if ((e.ctrlKey||e.metaKey)&&['c','v','x','u','s','p'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key==='F12') e.preventDefault(); // Cannot reliably disable browser developer tools.
  });
  state=load();
  if (state && state.stage==='exam' && Date.now()>=state.deadline) finalize('Lejárt az idő');
  else if (state?.stage==='exam') {
    // A reload is not a free reset: answers and deadline remain, and navigation was logged on leaving.
    guardGraceUntil=Date.now()+2200;
    history.pushState({pythonExam:true},'',location.pathname+location.search+location.hash);
    examPage();
  } else if (state?.stage==='finished') {resultsPage();if(state.serverStatus!=='saved')sendResult();}
  else homepage();
  // A restored browser should honour the next attempt number after an explicit reset.
  const originalLaunch=launch;
  launch = function(name,group,attempt,alias) {
    const next=Number(document.documentElement.dataset.nextAttempt||'0');
    delete document.documentElement.dataset.nextAttempt;
    return originalLaunch(name,group,next||attempt,alias);
  };
  setInterval(checkTime,250);
})();


</script></body></html>
